[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "analista-dados-bcb"
version = "0.1.0"
description = "Pergunte em português sobre juros, inflação e reclamações do Banco Central: a pergunta vira SQL somente leitura num DuckDB"
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
authors = [{ name = "Arthur Penedo" }]
dependencies = ["duckdb>=1.0"]

[project.optional-dependencies]
dev = ["pytest>=8"]

[project.scripts]
analista-dados-bcb = "analista_dados_bcb.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
